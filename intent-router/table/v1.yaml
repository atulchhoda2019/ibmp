version: table-v1
catalog_version: catalog-v1

# Global band edges. An intent may override them in the catalog; the trace records which
# edge set fired.
bands:
  HIGH: [0.85, 1.0]
  MEDIUM: [0.55, 0.85]
  LOW: [0.0, 0.55]

rows:
  # guards first: LOW, FROZEN and a missing entitlement outrank every normal row
  - {intent: any, band: LOW, capability: any, risk: any, auth: any,
     graph: G-FALLBACK, budgets: {steps: 2, tokens: 1000}, note: scripted-or-human, log_for_catalog_review: true}
  - {intent: any, band: any, capability: FROZEN, risk: TRANSACT, auth: any,
     graph: G-EXPLAIN-ROUTE, budgets: {steps: 4, tokens: 2000}, note: writes-disabled-during-freeze}
  - {intent: any, band: any, capability: unentitled, risk: any, auth: any,
     graph: G-EXPLAIN-ROUTE, budgets: {steps: 4, tokens: 2000}, note: permission-not-granted}

  # reads
  - {intent: plan.deductible.status, band: HIGH, capability: any, risk: READ, auth: any,
     graph: G-DEDUCTIBLE, budgets: {steps: 6, tokens: 4000}, entry_node: determine_context,
     evidence: {max_age_days: 7, abstain_if_stale: true}}
  # MEDIUM move 1: the read-only variant of the same topic. Value delivered, zero risk by
  # construction, so a read never spends the conversation's one question.
  - {intent: plan.deductible.status, band: MEDIUM, capability: any, risk: READ, auth: any,
     graph: G-DEDUCTIBLE, budgets: {steps: 4, tokens: 2500}, entry_node: readonly_summary,
     note: read-only-variant, evidence: {max_age_days: 7, abstain_if_stale: true}}
  - {intent: plan.deductible.info, band: HIGH, capability: any, risk: READ, auth: any,
     graph: G-DEDUCTIBLE, budgets: {steps: 6, tokens: 4000}, entry_node: determine_context,
     evidence: {max_age_days: 30, abstain_if_stale: true}}
  - {intent: plan.elections.view, band: RULE_OR_HIGH, capability: any, risk: READ, auth: any,
     graph: G-ELECTIONS-RO, budgets: {steps: 4, tokens: 2500}, entry_node: determine_context,
     evidence: {max_age_days: 7, abstain_if_stale: true}}

  # contribution change, ordered by descending rung: the highest autonomy the tenant bought wins
  - {intent: ret.contribution.change, band: RULE_OR_HIGH, capability: "enabled&rung>=4", risk: TRANSACT, auth: any,
     graph: G-CONTRIB-AUTO, budgets: {steps: 14, tokens: 9000}, entry_node: revalidate,
     note: autonomous-audited}
  - {intent: ret.contribution.change, band: RULE_OR_HIGH, capability: "enabled&rung>=3", risk: TRANSACT, auth: stepped_up,
     graph: G-CONTRIB-AUTO, budgets: {steps: 14, tokens: 9000}, entry_node: revalidate,
     note: execute-and-notify-reversible}
  - {intent: ret.contribution.change, band: RULE_OR_HIGH, capability: "enabled&rung>=2", risk: TRANSACT, auth: standard,
     graph: G-CONTRIB-CHANGE, budgets: {steps: 12, tokens: 8000}, entry_node: step_up_auth}
  - {intent: ret.contribution.change, band: RULE_OR_HIGH, capability: "enabled&rung>=2", risk: TRANSACT, auth: stepped_up,
     graph: G-CONTRIB-CHANGE, budgets: {steps: 12, tokens: 8000}, entry_node: create_preview}
  - {intent: ret.contribution.change, band: RULE_OR_HIGH, capability: "enabled&rung>=1", risk: TRANSACT, auth: any,
     graph: G-CONTRIB-DRAFT, budgets: {steps: 8, tokens: 5000}, entry_node: draft_for_human,
     note: draft-only-zero-direct-action}
  - {intent: ret.contribution.change, band: any, capability: disabled, risk: TRANSACT, auth: any,
     graph: G-EXPLAIN-ROUTE, budgets: {steps: 4, tokens: 2000}}
  # MEDIUM move 2: one named-options question. A transaction gets the question, not a guess.
  - {intent: ret.contribution.change, band: MEDIUM, capability: any, risk: TRANSACT, auth: any,
     graph: G-CLARIFY, budgets: {steps: 1, tokens: 500}, note: one-named-options-question, no_data_reads: true}

  # the confirmation resumption: stage 0 catches "yes, confirm it" and it re-enters the corridor
  - {intent: ret.contribution.confirm, band: RULE_OR_HIGH, capability: "enabled&rung>=2", risk: TRANSACT, auth: stepped_up,
     graph: G-CONTRIB-COMMIT, budgets: {steps: 8, tokens: 4000}, entry_node: revalidate,
     note: nonce-bound-idempotent-commit}
  - {intent: ret.contribution.confirm, band: RULE_OR_HIGH, capability: "enabled&rung>=2", risk: TRANSACT, auth: standard,
     graph: G-CONTRIB-CHANGE, budgets: {steps: 12, tokens: 8000}, entry_node: step_up_auth}
  - {intent: ret.contribution.confirm, band: any, capability: disabled, risk: TRANSACT, auth: any,
     graph: G-EXPLAIN-ROUTE, budgets: {steps: 4, tokens: 2000}}

  - {intent: life.event.divorce, band: HIGH, capability: any, risk: SENSITIVE, auth: any,
     graph: G-LIFE-EVENT-RO, budgets: {steps: 6, tokens: 4000}, entry_node: determine_context,
     note: empathetic-readonly-csr-offer, evidence: {max_age_days: 30, abstain_if_stale: true}}
  - {intent: __out_of_scope__, band: any, capability: any, risk: READ, auth: any,
     graph: G-FALLBACK, budgets: {steps: 2, tokens: 1000}, note: scripted-or-human, log_for_catalog_review: true}
